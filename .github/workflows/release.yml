name: Build & Release

# 仅对 main 分支构建发布：tag 用 account/Cargo.toml 的 version 自动生成
# （tag 就是版本号，不带 v 前缀）。tag 已存在时只构建不重复发版（幂等）。
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # reqwest HTTP/3 仍属 unstable 特性，必须显式打开该 cfg
  REQWEST_CFG: "--cfg reqwest_unstable"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: 读取版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: 从 Cargo.toml 读取版本号（即发布 tag）
        run: |
          version=$(grep -m1 '^version = ' account/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "未能从 account/Cargo.toml 读取 version" >&2
            exit 1
          fi
          echo "版本号: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: check
        name: 检查同名 tag 是否已存在
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.version }}" | grep -q .; then
            echo "tag ${{ steps.version.outputs.version }} 已存在，本次只构建不发版"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  server:
    name: 计算端 ${{ matrix.asset }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
            arch: x86_64-pc-windows-msvc
            rustflags: "--cfg reqwest_unstable"
          # Linux 用 musl + crt-static 产出完全静态二进制（不依赖 glibc）
          - os: ubuntu-latest
            asset: linux-x64
            arch: x86_64-unknown-linux-musl
            rustflags: "--cfg reqwest_unstable -C target-feature=+crt-static"
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      # musl 目标编译 bundled SQLite（C 代码）需要 musl-gcc
      - name: 安装 musl 工具链
        if: matrix.arch == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # 计算端不启用 client 特性 → 依赖图里没有 GPUI / GUI 库
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: account

      - name: 构建计算端（release）
        working-directory: account
        run: cargo build --release --bin account_server --target ${{ matrix.arch }}

      - name: 断言静态链接（Linux）
        if: matrix.arch == 'x86_64-unknown-linux-musl'
        shell: bash
        working-directory: account
        run: |
          set -euo pipefail
          bin="target/${{ matrix.arch }}/release/account_server"
          file "$bin"
          if readelf -d "$bin" | grep -q 'NEEDED'; then
            echo "产物仍依赖动态库：" >&2
            readelf -d "$bin" >&2
            exit 1
          fi

      - name: 打包产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="account/target/${{ matrix.arch }}/release/account_server"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="$bin.exe"
            powershell -Command "Compress-Archive -Path '$bin' -DestinationPath 'dist/account_server-${{ matrix.asset }}.zip' -Force"
          else
            tar -czf "dist/account_server-${{ matrix.asset }}.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          overwrite: true

  # macOS 计算端（可选作业；runner 不可用时不影响其它平台发布）
  server_macos:
    name: 计算端 macos-arm64（可选）
    needs: meta
    runs-on: macos-latest
    continue-on-error: true
    env:
      RUSTFLAGS: "--cfg reqwest_unstable"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: account

      - name: 构建计算端（release）
        working-directory: account
        run: cargo build --release --bin account_server --target aarch64-apple-darwin

      - name: 打包产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="account/target/aarch64-apple-darwin/release/account_server"
          tar -czf "dist/account_server-macos-arm64.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: server-macos-arm64
          path: dist/*
          if-no-files-found: error
          overwrite: true

  desktop:
    name: 桌面客户端 ${{ matrix.asset }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, asset: windows-x64 }
          - { os: ubuntu-latest, asset: linux-x64 }
    env:
      RUSTFLAGS: "--cfg reqwest_unstable"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # GPUI 在 Linux 需要 Wayland/X11、fontconfig、Vulkan 等开发库
      - name: 安装 Linux 构建依赖（GPUI）
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config gcc g++ clang \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev \
            libwebkit2gtk-4.1-dev libasound2-dev \
            vulkan-validationlayers libvulkan1
          pkg-config --modversion fontconfig
          pkg-config --modversion xkbcommon

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: account

      - name: 构建桌面客户端（release）
        working-directory: account
        run: cargo build --release --bin account_client --features client

      - name: 归档客户端产物
        shell: bash
        run: |
          set -euo pipefail
          name="account_client-${{ matrix.asset }}"
          mkdir -p dist stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp account/target/release/account_client.exe stage/
            powershell -Command "Compress-Archive -Path 'stage/*' -DestinationPath 'dist/$name.zip' -Force"
          else
            cp account/target/release/account_client stage/
            tar -czf "dist/$name.tar.gz" -C stage .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: client-desktop-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          overwrite: true

  # macOS 桌面客户端（可选作业）
  desktop_macos:
    name: 桌面客户端 macos-arm64（可选）
    needs: meta
    runs-on: macos-latest
    continue-on-error: true
    env:
      RUSTFLAGS: "--cfg reqwest_unstable"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: account

      - name: 构建桌面客户端（release）
        working-directory: account
        run: cargo build --release --bin account_client --features client --target aarch64-apple-darwin

      - name: 归档客户端产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp account/target/aarch64-apple-darwin/release/account_client stage/
          tar -czf "dist/account_client-macos-arm64.tar.gz" -C stage .
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: client-desktop-macos-arm64
          path: dist/*
          if-no-files-found: error
          overwrite: true

  release:
    name: 发布 Release（tag = Cargo 版本号）
    needs: [meta, server, desktop, server_macos, desktop_macos]
    if: ${{ !cancelled() && needs.meta.outputs.tag_exists == 'false' && needs.server.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 列出待发布文件
        run: find artifacts -type f | sort

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ${{ needs.meta.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
