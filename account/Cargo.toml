[package]
name = "account"
version = "0.5.1"
edition = "2024"
description = "Personal bookkeeping app (axum server + GPUI client)"
license = "MIT"
repository = "https://github.com/matt8848-max/account"

[[bin]]
name = "account_server"
path = "bin/account_server.rs"

[[bin]]
name = "account_client"
path = "bin/account_client.rs"
# 客户端依赖 GPUI（仅桌面），需启用 client 特性：
# cargo run --bin account_client --features client
required-features = ["client"]

[features]
# 客户端 UI（GPUI）。server 不启用该特性，因此编译 account_server 时
# 依赖图中不含任何 GUI 库。
client = ["dep:gpui-kit", "dep:rfd", "dep:rust-embed", "dep:image"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# 后端（native）
axum = { version = "0.8.9", features = ["http2"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
env_logger = "0.11.11"
rcgen = "0.14.9"
reqwest = { version = "0.13.4", features = ["json", "rustls", "http3"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = { version = "0.102.0", features = ["chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }

# HTTP/3（QUIC）：h3 负责协议，h3-axum 把现有 axum Router 直接挂到 H3 上
bytes = "1.10.1"
h3 = "0.0.8"
h3-axum = "0.3.1"
h3-quinn = "0.0.10"
quinn = { version = "0.11.7", features = ["runtime-tokio", "rustls"] }
rustls = { version = "0.23.4", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pemfile = "2.2.0"

# 客户端（仅 client 特性）：GPUI Kit 0.10（含组件与默认图标资产）
gpui-kit = { version = "0.10.0", optional = true }
# 原生「另存为」对话框（导出 xlsx）
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
# 项目 assets/ 嵌入（窗口图标等）
rust-embed = { version = "8.14.0", optional = true }
# Linux/X11 窗口图标解码（PNG → RgbaImage）
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.build-dependencies]
# 把 assets/icon.ico 编进 Windows exe；GPUI 从 exe 资源 ID=1 加载窗口/任务栏图标
winresource = "0.1.19"

# 开发期：GPUI 依赖以优化级别编译，避免 debug 运行时过慢。
# （不影响编译时间，只影响运行流畅度）
[profile.dev.package.gpui-pre]
opt-level = 3
[profile.dev.package.gpui-component]
opt-level = 3
[profile.dev.package.gpui-kit]
opt-level = 3
[profile.dev.package.gpui-kit-assets]
opt-level = 3
[profile.dev.package.gpui-pre-platform]
opt-level = 3
[profile.dev.package.rustybuzz]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
