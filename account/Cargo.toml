[package]
name = "account"
version = "0.4.1"
edition = "2024"
description = "Personal bookkeeping app (axum server + Dioxus client)"
license = "MIT"
repository = "https://github.com/matt8848-max/account"

[[bin]]
name = "server"
path = "bin/server.rs"

[[bin]]
name = "client"
path = "bin/client.rs"
# 客户端依赖 UI（Dioxus），需启用 client 特性：cargo run --bin client --features client
required-features = ["client"]

[features]
# dioxus-cli 打包（dx bundle）需要显式启用 bundle 特性
bundle = []
# 客户端 UI（Dioxus）。server 不启用该特性，因此 Linux 上编译/运行 server
# 都不再需要 GTK / WebKitGTK 等 GUI 运行库（server 只依赖 axum + rusqlite）
client = [
    "dep:dioxus",
    "dep:rfd",
    "dep:dioxus-logger",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
]

[dependencies]
# 全平台可用
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# native：后端 + Dioxus 桌面客户端
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.9", features = ["http2"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
# 仅客户端（client 特性）需要；server 不启用可免装 GUI 库
dioxus = { version = "0.7.10", features = ["desktop"], optional = true }
env_logger = "0.11.11"
rcgen = "0.14.9"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
# 原生「另存为」对话框：与 dioxus-desktop 使用完全相同的 features，
# 复用已编译的 rfd，不引入额外构建成本
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# xlsx 导出（客户端本地生成，不经服务器）
rust_xlsxwriter = { version = "0.102.0", features = ["chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }

# wasm：Dioxus Web 客户端
[target.wasm32-unknown-unknown.dependencies]
dioxus = { version = "0.7.10", features = ["web"], optional = true }
dioxus-logger = { version = "0.7.10", optional = true }
gloo-net = { version = "0.7.0", features = ["http", "json"], optional = true }
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
js-sys = { version = "0.3.104", optional = true }
# xlsx 导出：wasm 目标需启用 wasm feature（js-sys + wasm-bindgen，用于浏览器下载）
rust_xlsxwriter = { version = "0.102.0", features = ["chrono", "wasm"] }
# 浏览器下载需要把 create_element 的结果转成 HtmlAnchorElement（JsCast）
wasm-bindgen = { version = "0.2.127", optional = true }
web-sys = { version = "0.3.104", features = ["Window", "Document", "HtmlInputElement", "HtmlSelectElement", "HtmlOptionElement", "Blob", "Url", "HtmlAnchorElement"], optional = true }
